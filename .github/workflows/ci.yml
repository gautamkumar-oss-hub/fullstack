name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify API and PostgreSQL migrations
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate checked API types
        working-directory: frontend
        run: npm run generate:api:file
      - name: Check committed generated types
        run: git diff --exit-code -- frontend/src/api/generated.ts
      - name: Test, lint, and build
        working-directory: frontend
        run: npm test && npm run lint && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose config --quiet
